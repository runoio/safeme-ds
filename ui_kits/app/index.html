<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SafeMe — App UI Kit</title>
<link rel="stylesheet" href="../../styles.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@0.544.0/dist/umd/lucide.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  html, body { margin: 0; height: 100%; }
  body { background: radial-gradient(circle at 50% 0%, #1a2170 0%, #0E1353 70%); font-family: var(--font-body); display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 24px; box-sizing: border-box; }
  a { color: var(--text-link); }
  a:hover { color: var(--blue-action-500); }
  .phone { width: 390px; height: 812px; background: #000; border-radius: 46px; padding: 10px; box-shadow: 0 40px 90px rgba(0,0,0,.5); flex: none; }
  .screen { width: 100%; height: 100%; background: var(--app-bg); border-radius: 38px; overflow: hidden; position: relative; }
  .notch { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); width: 120px; height: 26px; background: #000; border-radius: 0 0 16px 16px; z-index: 50; }
</style>
</head>
<body>
<div class="phone"><div class="screen"><div class="notch"></div><div id="root" style="height:100%"></div></div></div>

<script src="AppChrome.jsx" type="text/babel"></script>
<script src="HomeScreen.jsx" type="text/babel"></script>
<script src="RouteSetupScreen.jsx" type="text/babel"></script>
<script src="ActiveMonitoringScreen.jsx" type="text/babel"></script>
<script src="AssistantCallScreen.jsx" type="text/babel"></script>
<script type="text/babel" data-presets="react">
  const { useState } = React;
  function App() {
    const [screen, setScreen] = useState('home');
    const nav = (s) => setScreen(s);
    switch (screen) {
      case 'route': return <RouteSetupScreen onBack={() => nav('home')} onStart={() => nav('active')} />;
      case 'active': return <ActiveMonitoringScreen onBack={() => nav('home')} onSOS={() => nav('assistant')} />;
      case 'assistant': return <AssistantCallScreen onBack={() => nav('home')} />;
      default: return <HomeScreen onNav={nav} onSOS={() => nav('assistant')} />;
    }
  }
  function mount() {
    if (!window.HomeScreen || !window.RouteSetupScreen || !window.ActiveMonitoringScreen || !window.AssistantCallScreen) {
      return setTimeout(mount, 40);
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  }
  mount();
</script>
</body>
</html>
