<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="design_doc_mode" content="canvas">
<link rel="stylesheet" href="styles.css">
<style>
body{margin:0;font-family:var(--font-body)}
a{color:var(--text-link)}a:hover{color:var(--blue-action-600)}
.wrap{position:absolute;left:0;top:0;width:1360px;display:grid;grid-template-columns:repeat(5,1fr);gap:24px}
.opt{background:var(--surface-card);border-radius:24px;padding:28px 20px 22px;display:flex;flex-direction:column;align-items:center;gap:18px;box-shadow:var(--shadow-sm);position:relative}
.n{position:absolute;top:14px;left:14px;font:700 13px/1 var(--font-head);color:#fff;background:var(--blue-800);border-radius:999px;padding:6px 10px}
.btn{width:170px;height:170px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:#fff;background:radial-gradient(circle at 50% 38%,var(--blue-action-300) 0%,var(--blue-action-500) 55%,var(--blue-action-600) 100%);box-shadow:var(--shadow-observe)}
.btn span{font:700 15px/1 var(--font-head);letter-spacing:.02em}
.row{display:flex;gap:14px;align-items:center}
.sm{width:56px;height:56px;border-radius:16px;display:grid;place-items:center}
.t{font:700 15px/1.3 var(--font-head);color:var(--text-strong);text-align:center}
.d{font-size:13px;line-height:1.45;color:var(--text-muted);text-align:center;margin:-10px 0 0;text-wrap:pretty}
</style>
</head>
<body>
<div class="wrap" id="w"></div>
<script>
const I=[
['Lupa z pinem','Twoja propozycja. Pin w soczewce: „patrzymy na Twoją lokalizację”.','<circle cx="10.5" cy="10.5" r="7"/><path d="M15.6 15.6 21 21"/><path d="M10.5 14.2s-3-2.6-3-4.7a3 3 0 0 1 6 0c0 2.1-3 4.7-3 4.7z"/><circle cx="10.5" cy="9.5" r=".9"/>'],
['Oko z pinem','Oko, w którym źrenicą jest pin. Najmocniej mówi „czuwamy”.','<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><path d="M12 15.2s-2.4-2-2.4-3.8a2.4 2.4 0 0 1 4.8 0c0 1.8-2.4 3.8-2.4 3.8z"/>'],
['Pin z falami','Pin nadający sygnał. Kojarzy się z obserwacją na żywo.','<path d="M12 21s-5-4.6-5-8.5a5 5 0 0 1 10 0c0 3.9-5 8.5-5 8.5z"/><circle cx="12" cy="12.5" r="1.8"/><path d="M5.2 6.2a9.5 9.5 0 0 1 13.6 0"/><path d="M7.8 8.6a5.8 5.8 0 0 1 8.4 0"/>'],
['Trasa A → B','Kropkowana droga od startu do pinu celu. Mówi „Twoja trasa”.','<circle cx="5" cy="19" r="2"/><path d="M7 19h4a3 3 0 0 0 0-6H9a3 3 0 0 1 0-6h4" stroke-dasharray="2 2.6"/><path d="M18 11s-3.5-3.2-3.5-5.8a3.5 3.5 0 0 1 7 0C21.5 7.8 18 11 18 11z"/><circle cx="18" cy="5.3" r=".9"/>'],
['Strzałka nawigacji','Klasyczny symbol „jestem w drodze”. Prosty i czytelny w małym rozmiarze.','<path d="M3 11 21 3l-8 18-2-8-8-2z"/>'],
['Tarcza z pinem','Ochrona i lokalizacja w jednym. Najbliżej „agencji ochrony”.','<path d="M12 22s8-3.5 8-10V5l-8-3-8 3v7c0 6.5 8 10 8 10z"/><path d="M12 15.5s-2.6-2.2-2.6-4.1a2.6 2.6 0 0 1 5.2 0c0 1.9-2.6 4.1-2.6 4.1z"/>'],
['Celownik lokalizacji','Znany z map symbol „namierzamy Cię”. Neutralny i techniczny.','<circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2.5"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/>'],
['Lornetka','Dosłowna „obserwacja”. Może się kojarzyć z podglądaniem.','<circle cx="6.5" cy="15.5" r="3.5"/><circle cx="17.5" cy="15.5" r="3.5"/><path d="M10 15.5h4M4 12.5 6 5h3l1 7M20 12.5 18 5h-3l-1 7"/>'],
['Pin z okiem','Pin, w którego głowie jest oko. Odwrotność opcji 2.','<path d="M12 22s-7-6.2-7-12a7 7 0 0 1 14 0c0 5.8-7 12-7 12z"/><path d="M8.2 10s1.5-2.4 3.8-2.4 3.8 2.4 3.8 2.4-1.5 2.4-3.8 2.4S8.2 10 8.2 10z"/><circle cx="12" cy="10" r=".9"/>'],
['Pin w okręgu ruchu','Pin otoczony łukiem ze strzałką. Mówi „śledzimy Cię w ruchu”.','<path d="M12 16s-3.2-2.8-3.2-5.2a3.2 3.2 0 0 1 6.4 0c0 2.4-3.2 5.2-3.2 5.2z"/><path d="M20 12a8 8 0 1 1-2.3-5.7"/><path d="M18 2.8v3.8h-3.8"/>']
];
const svg=(p,s,c)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
document.getElementById('w').innerHTML=I.map((x,i)=>`<div class="opt" id="o${i+1}"><span class="n">${i+1}</span><div class="btn">${svg(x[2],44,'#fff')}<span>OBSERWACJA</span></div><div class="row"><div class="sm" style="background:var(--blue-action-100)">${svg(x[2],26,'#006DDB')}</div><div class="sm" style="background:var(--blue-800)">${svg(x[2],26,'#5BADFF')}</div>${svg(x[2],18,'#0E1353')}</div><div class="t">${x[0]}</div><p class="d">${x[1]}</p></div>`).join('');
</script>
</body>
</html>
