<!DOCTYPE html>
<html lang="pl">
<head>

<link rel="stylesheet" href="./styles.css" />
<style>

      <polygon points="21.75 47.52 40.32 47.52 45.37 35.21 26.77 35.21 21.75 47.52" fill="#FF1616" />
    </svg>
  </div>
  <div class="strip">

    <div style="background:#ED3745"></div>
    <div style="background:#FF1616"></div>
  </div>

</body>
</html>
