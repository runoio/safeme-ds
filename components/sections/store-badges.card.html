<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;padding:40px;background:var(--surface-page);font-family:var(--font-body)}.stack{display:flex;flex-direction:column;gap:40px}.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:24px}</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const DS = window.SafeMeDesignSystem_c9bbeb;
function Demo(){
  const { StoreBadges } = DS;
  const L=({children})=><p style={{margin:'0 0 12px',fontSize:12,fontWeight:600,letterSpacing:'0.08em',textTransform:'uppercase',color:'var(--text-muted)'}}>{children}</p>;
  return (<div className="stack">
    <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:24}}>
      <div><L>Official · PL</L><StoreBadges variant="official" lang="pl" /></div>
      <div><L>Official · EN</L><StoreBadges variant="official" lang="en" /></div>
    </div>
    <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:24}}>
      <div style={{padding:24,borderRadius:16,background:'var(--gradient-hero)'}}><StoreBadges tone="dark" /></div>
      <div style={{padding:24,borderRadius:16,background:'#fff',border:'1px solid var(--border-subtle)'}}><StoreBadges tone="light" /></div>
    </div>
  </div>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body>
</html>
