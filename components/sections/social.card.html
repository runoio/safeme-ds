<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8" />

<style>body{margin:0;padding:40px;background:var(--surface-page);font-family:var(--font-body)}.stack{display:flex;flex-direction:column;gap:40px}.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:24px}</style>

<body>
<div id="root"></div>
<script type="text/babel">
const DS = window.SafeMeDesignSystem_c9bbeb;
function Demo(){
  const { SectionHeader, TestimonialCard, FeatureCard, BenefitBanner, ClosingCTA } = DS;
  const I = (d) => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" dangerouslySetInnerHTML={{__html:d}} />;
  return (<div className="stack">
    <SectionHeader title="Opinie" />
    <div className="grid3">
      <TestimonialCard lang="pl" quote="Korzystam z SafeMe regularnie i naprawdę działa. Włączam Obserwację, gdy wracam późno sama, i mam ogromne poczucie bezpieczeństwa. Polecam każdemu." author="Karolina" />
      <TestimonialCard lang="pl" quote="Świetna aplikacja! W końcu aż tak się nie martwię o córkę jak wychodzi wieczorami! Mamy pakiet family, polecam każdemu!" author="Barbara" />
      <TestimonialCard lang="pl" quote="Super apka! Korzystam we Wrocławiu i działa bardzo dobrze." author="Adrianna" />
    </div>
    <SectionHeader title="What makes us different" />
    <DS.CardCarousel>{[['Operational readiness 24/7','We operate non-stop, around the clock, every day of the year.'],['No burden on your loved ones','It is us who react, not family or friends who may not know what to do. Every report goes to a trained security professional.'],['Effective access to emergency services','In case of danger we immediately direct the appropriate services to the scene, handing them complete information about you and your location.'],['Created by professionals','Behind the app stands a team of security and alarm-monitoring specialists, not just an algorithm.'],['We close the safety gap','There is a gap between feeling unsafe and the moment you can call the emergency services. We react as soon as unease appears, even when there are no grounds yet to call them.'],['Data security','We process data in line with GDPR and store it on servers in the European Union. We share it only with emergency services, and only as part of an active report.']].map(([t,b],i)=><DS.HowItWorksSteps key={t} variant="cards" start={i+1} steps={[{title:t,body:b}]} />)}</DS.CardCarousel>
    <BenefitBanner title="Benefit pracowniczy" body="Bezpieczeństwo i spokój to wartości bezcenne. Dzięki SafeMe możesz zaoferować je swoim pracownikom - jako benefit, który chroni zespół 24/7, także poza pracą." ctaLabel="Poznaj ofertę dla firm" href="#" />
    <ClosingCTA title="Poczuj się bezpiecznie. Pobierz aplikację i testuj przez 7 dni za darmo." appStoreUrl="https://apps.apple.com/pl/app/safeme/id6451586056" googlePlayUrl="https://play.google.com/store/apps/details?id=pl.safeme.client" />
  </div>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
