<body>
<div id="root"></div>
<script type="text/babel">
const DS = window.SafeMeDesignSystem_c9bbeb;
function Demo(){
  const { SectionHeader, FAQAccordion, VideoCard } = DS;
  const y = (id) => 'https://i.ytimg.com/vi/' + id + '/oar2.jpg';
  return (<div className="stack">
    <FAQAccordion items={[
      {q:'Does the employer see the employees\' location?',a:'No. The location is available only to the Safety Assistant and only during an active report or route Observation. The admin panel is used solely to manage licences. The employer does not see who uses the app, when or where. User privacy is fully protected.'},
      {q:'Can employees use the app privately, outside working hours?',a:'Yes, and that is exactly the point. The protection works 24 hours a day, 7 days a week, also during private journeys, evening returns, runs or taxi rides. The number of Help calls and route Observations is unlimited.'},

    <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(180px,1fr))',gap:20}}>
      <VideoCard thumbnail={y('4h3pY5HJ78k')} caption="When I use SafeMe" />
      <VideoCard thumbnail={y('bQXmvbEu5mg')} caption="What is the safety gap?" />

      <VideoCard thumbnail={y('aElGkelznvM')} caption="One tap safety assistant" />
