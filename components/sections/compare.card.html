<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;padding:40px;background:var(--surface-page);font-family:var(--font-body)}.stack{display:flex;flex-direction:column;gap:40px}.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:24px}</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const DS = window.SafeMeDesignSystem_c9bbeb;
function Demo(){
  const { SectionHeader, CompareTable, CardCarousel, TestimonialCard } = DS;
  const q=[['Charlotte','I use SafeMe regularly and it really works. I turn on Observation whenever I come home late on my own, and it gives me a huge sense of safety. I recommend it to everyone.'],['Sophie','A great app! I finally worry so much less about my daughter when she goes out in the evening. We have the Family package, I recommend it to everyone!'],['Ryan','I recommend it to anyone who wants to take care of their safety. The app runs smoothly and fast, without freezing.'],['Emma','A great app! It works really well wherever I am.'],['Chloe','I downloaded it after seeing an ad on TikTok and I am surprised how well it works and how fast they react. I recommend it to anyone who comes home alone late. It is reassuring.'],['Grace','This app is a very important step towards greater safety and independence! A great idea!']];
  return (<div className="stack">
    <div>
      <SectionHeader eyebrow="The question everyone asks" title="Why not just share my location with a friend?" subtitle="Because your friend might be asleep, and even if they're not, they won't know what to do next." />
      <div style={{display:'grid',gridTemplateColumns:'minmax(0,1fr) minmax(220px,300px)',gap:48,alignItems:'center',background:'var(--surface-card)',borderRadius:'var(--radius-xl)',padding:40}}>
        <CompareTable columns={['Sharing your location','SafeMe']} rows={[
          {label:"Who's watching",other:'A friend, when they happen to check their phone',safeme:'A trained Safety Assistant, on duty 24/7'},
          {label:'Spotting a problem',other:'Only if they notice the dot has stopped moving',safeme:'The Assistant sees when you leave your route or stop, and checks in'},
          {label:'What happens next',other:'They worry, keep calling, and have to decide under stress',safeme:'A professional assesses the situation and sends help with your exact location'},
          {label:'Your loved ones',other:'Stay up waiting for your message',safeme:'Can go to sleep'}]} />
        <DS.VideoCard videoId="aElGkelznvM" caption="One tap safety assistant" orientation="vertical" />
      </div>
    </div>
    <DS.SplitPanel title="Why SafeMe and not the emergency number?" mediaWidth={280} gapScale={['Feeling unsafe','Safety gap · Safety Assistant','Emergency services']} highlight="This gap is filled by the Safety Assistant, who supports you as soon as anxiety appears." text={"Between feeling unsafe and the moment emergency services can be called there is a gap, the so-called safety gap. When you feel uneasy but nothing has happened yet, the emergency number cannot help you, because there are no grounds for an intervention. This gap is filled by the Safety Assistant, who supports you as soon as anxiety appears.\n\nThe Assistant has access to your location and details, so they act immediately, without keeping you on the line or questioning whether your report is justified. They propose solutions straight away, provide support and, when necessary, direct the appropriate services to the scene. We also act preventively and react before a threat escalates."} media={<DS.VideoCard videoId="bQXmvbEu5mg" caption="SafeMe in action" showCaption={false} onDark />} />
    <div>
      <SectionHeader title="Reviews" />
      <CardCarousel>{q.map(([a,t])=><TestimonialCard key={a} lang="en" author={a} quote={t} />)}</CardCarousel>
    </div>
  </div>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body>
</html>
