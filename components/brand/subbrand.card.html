<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
body{margin:0;padding:28px;background:var(--surface-page);font-family:var(--font-body)}
.grid{display:flex;align-items:center;gap:24px;flex-wrap:wrap}
.tile{display:flex;align-items:center;justify-content:center;padding:26px 32px;border-radius:var(--radius-lg);border:1px solid var(--border-subtle);background:var(--surface-card)}
.dark{background:var(--surface-dark);border-color:var(--surface-dark)}
.black{background:#000;border-color:#000}
.note{margin-top:22px;font-size:13px;line-height:1.6;color:var(--text-secondary);max-width:640px}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { Logo } = window.SafeMeDesignSystem_c9bbeb;
function Demo(){
  return (
    <div>
      <div className="grid">
        <div className="tile"><Logo subBrand="Nieruchomości" height={40} /></div>
        <div className="tile dark"><Logo subBrand="Nieruchomości" tone="light" height={40} /></div>
        <div className="tile black"><Logo subBrand="Nieruchomości" tone="light" height={28} /></div>
        <div className="tile"><Logo variant="sygnet" subBrand="Nieruchomości" height={44} /></div>
      </div>
      <p className="note">Sub-brand label is Montserrat 600, uppercase, ink-colored (never red), letter-spread to the exact width of the wordmark. Minimum wordmark height with a label: 28&nbsp;px. Never set the label larger than 30% of the mark height, and never place a second line under it.</p>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body>
</html>
