<!-- @dsCard group="Components" viewport="700x700" name="Buttons & Inputs" subtitle="Button, IconButton, Input, Switch" -->
<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@0.544.0/dist/umd/lucide.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body { margin: 0; padding: 24px; background: var(--surface-page); font-family: var(--font-body); }
  .row { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 18px; }
  .lbl { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--text-muted); width: 100%; margin-bottom: 2px; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { Button, IconButton, Input, Switch, Badge, Card, StatusPill } = window.SafeMeDesignSystem_c9bbeb;
const Icon = ({ n, size = 18 }) => {
  const ref = React.useRef(null);
  React.useEffect(() => { if (ref.current) { ref.current.innerHTML = ''; ref.current.appendChild(lucide.createElement(lucide[n])); const s = ref.current.querySelector('svg'); if (s){ s.setAttribute('width', size); s.setAttribute('height', size); } } });
  return <span ref={ref} style={{ display: 'inline-flex' }} />;
};
function Demo() {
  const [on, setOn] = React.useState(true);
  return (
    <div>
      <div className="row"><span className="lbl">Button variants</span>
        <Button variant="primary">Rozpocznij</Button>
        <Button variant="safe" iconLeft={<Icon n="MapPin" />}>Wybierz trasę</Button>
        <Button variant="danger">Alarm</Button>
        <Button variant="outline">Anuluj</Button>
        <Button variant="ghost">Później</Button>
        <Button variant="primary" disabled>Wyłączony</Button>
      </div>
      <div className="row"><span className="lbl">IconButton · Switch</span>
        <IconButton variant="solid" aria-label="a"><Icon n="Phone" size={20} /></IconButton>
        <IconButton variant="safe" aria-label="b"><Icon n="MessageCircle" size={20} /></IconButton>
        <IconButton variant="outline" aria-label="c"><Icon n="Settings" size={20} /></IconButton>
        <IconButton variant="ghost" aria-label="d"><Icon n="Bell" size={20} /></IconButton>
        <span style={{ width: 20 }} />
        <Switch checked={on} onChange={setOn} />
        <Switch checked={false} onChange={() => {}} />
      </div>
      <div className="row" style={{ alignItems: 'flex-start' }}><span className="lbl">Input</span>
        <div style={{ width: 260 }}><Input label="Dokąd jedziesz?" placeholder="Wpisz adres" iconLeft={<Icon n="MapPin" />} /></div>
        <div style={{ width: 220 }}><Input label="Kod PIN" error="Nieprawidłowy kod" defaultValue="12" /></div>
      </div>
      <div className="row"><span className="lbl">Badge tones · Card</span>
        <Badge tone="safe" dot>Trasa aktywna</Badge>
        <Badge tone="danger" dot>Alarm</Badge>
        <Badge tone="success" dot>Bezpiecznie</Badge>
        <Badge tone="warning">Uwaga</Badge>
        <Badge tone="brand">SafeMe</Badge>
        <Badge tone="neutral">24/7</Badge>
        <Card elevation="md" padding="sm" style={{ marginLeft: 8 }}><span style={{ fontFamily: 'var(--font-head)', fontWeight: 700, color: 'var(--text-strong)' }}>Card surface</span></Card>
      </div>
      <div className="row"><span className="lbl">StatusPill</span>
        <span style={{ display: 'inline-flex', gap: 14, alignItems: 'center', background: 'var(--blue-800)', padding: '14px 18px', borderRadius: 'var(--radius-lg)' }}>
          <StatusPill>Dostępni 24/7</StatusPill>
          <StatusPill size="sm" dotColor="var(--blue-action-500)">Asystent czuwa</StatusPill>
        </span>
        <StatusPill onDark={false}>Dostępni 24/7</StatusPill>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body>
</html>
