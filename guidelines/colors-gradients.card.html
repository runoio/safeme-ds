<!-- @dsCard group="Colors" viewport="700x230" name="Brand gradients" subtitle="Blue → dark gradients for hero & CTA surfaces" -->
<!DOCTYPE html><html lang="pl"><head><meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin:0; padding:20px; background:var(--surface-page); font-family:var(--font-body); }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  .g { height:82px; border-radius:var(--radius-lg); display:flex; align-items:flex-end; padding:10px 12px; }
  .n { font-family:var(--font-head); font-weight:600; font-size:12px; color:#fff; letter-spacing:.02em; }
</style></head><body>
<div class="grid">
  <div class="g" style="background:var(--gradient-hero)"><span class="n">--gradient-hero</span></div>
  <div class="g" style="background:var(--gradient-deep)"><span class="n">--gradient-deep</span></div>
  <div class="g" style="background:var(--gradient-spotlight)"><span class="n">--gradient-spotlight</span></div>
  <div class="g" style="background:var(--gradient-band)"><span class="n">--gradient-band</span></div>
</div>
</body></html>
