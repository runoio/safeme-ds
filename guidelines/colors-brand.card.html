<!-- @dsCard group="Colors" viewport="700x150" name="Brand colors" subtitle="The four SafeMe brand values" -->
<!DOCTYPE html><html lang="pl"><head><meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin:0; padding:20px; background:var(--surface-page); font-family:var(--font-body); }
  .row { display:flex; gap:14px; }
  .sw { flex:1; border-radius:var(--radius-md); overflow:hidden; border:1px solid var(--border-subtle); }
  .chip { height:64px; }
  .meta { padding:8px 10px; background:var(--surface-card); }
  .name { font-family:var(--font-head); font-weight:700; font-size:13px; color:var(--text-strong); }
  .hex { font-size:12px; color:var(--text-muted); let-spacing:.02em; }
  .note { font-size:11px; color:var(--text-muted); margin-top:3px; }
</style></head><body>
<div class="row">
  <div class="sw"><div class="chip" style="background:#FF1616"></div><div class="meta"><div class="name">Brand red</div><div class="hex">#FF1616</div><div class="note">Logo & brand accent</div></div></div>
  <div class="sw"><div class="chip" style="background:#ED3745"></div><div class="meta"><div class="name">Action red</div><div class="hex">#ED3745</div><div class="note">SOS / emergency only</div></div></div>
  <div class="sw"><div class="chip" style="background:#0E1353"></div><div class="meta"><div class="name">Dark blue</div><div class="hex">#0E1353</div><div class="note">Text, trust, primary</div></div></div>
  <div class="sw"><div class="chip" style="background:#5BADFF"></div><div class="meta"><div class="name">Action blue</div><div class="hex">#5BADFF</div><div class="note">Safe / informational</div></div></div>
</div>
</body></html>
