<!-- @dsCard group="Colors" viewport="700x150" name="Status & semantic" subtitle="Safe, danger, success, warning" -->
<!DOCTYPE html><html lang="pl"><head><meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin:0; padding:20px; background:var(--surface-page); font-family:var(--font-body); }
  .row { display:flex; gap:14px; }
  .sw { flex:1; }
  .chip { height:44px; border-radius:var(--radius-sm); display:flex; align-items:center; padding:0 12px; }
  .pill { display:inline-flex; align-items:center; gap:6px; padding:4px 10px; border-radius:var(--radius-pill); font-family:var(--font-head); font-weight:600; font-size:12px; margin-top:8px; }
  .dot { width:7px; height:7px; border-radius:50%; }
  .name { font-family:var(--font-head); font-weight:700; font-size:12px; color:var(--text-strong); margin-top:6px; }
  .hex { font-size:11px; color:var(--text-muted); }
</style></head><body>
<div class="row">
  <div class="sw"><div class="chip" style="background:var(--blue-action-500)"></div>
    <div class="pill" style="background:var(--blue-action-50);color:var(--blue-action-600)"><span class="dot" style="background:var(--blue-action-500)"></span>Bezpiecznie</div>
    <div class="name">Safe</div><div class="hex">#5BADFF</div></div>
  <div class="sw"><div class="chip" style="background:var(--action-red-500)"></div>
    <div class="pill" style="background:var(--action-red-100);color:var(--action-red-600)"><span class="dot" style="background:var(--action-red-500)"></span>Alarm</div>
    <div class="name">Danger</div><div class="hex">#ED3745</div></div>
  <div class="sw"><div class="chip" style="background:var(--success)"></div>
    <div class="pill" style="background:var(--success-100);color:var(--success)"><span class="dot" style="background:var(--success)"></span>Dotarłeś</div>
    <div class="name">Success</div><div class="hex">#1F9D57</div></div>
  <div class="sw"><div class="chip" style="background:var(--warning)"></div>
    <div class="pill" style="background:var(--warning-100);color:#8a5d00"><span class="dot" style="background:var(--warning)"></span>Uwaga</div>
    <div class="name">Warning</div><div class="hex">#E8A317</div></div>
</div>
</body></html>
