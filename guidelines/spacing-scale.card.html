<!-- @dsCard group="Spacing" viewport="700x170" name="Spacing scale" subtitle="4px base grid" -->
<!DOCTYPE html><html lang="pl"><head><meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin:0; padding:22px; background:var(--surface-card); font-family:var(--font-body); }
  .item { display:flex; align-items:center; gap:14px; margin-bottom:7px; }
  .bar { height:14px; background:var(--blue-action-500); border-radius:3px; }
  .lbl { font-size:12px; color:var(--text-muted); width:120px; font-weight:600; }
</style></head><body>
  <div class="item"><span class="lbl">--space-1 · 4</span><div class="bar" style="width:4px"></div></div>
  <div class="item"><span class="lbl">--space-2 · 8</span><div class="bar" style="width:8px"></div></div>
  <div class="item"><span class="lbl">--space-3 · 12</span><div class="bar" style="width:12px"></div></div>
  <div class="item"><span class="lbl">--space-4 · 16</span><div class="bar" style="width:16px"></div></div>
  <div class="item"><span class="lbl">--space-6 · 24</span><div class="bar" style="width:24px"></div></div>
  <div class="item"><span class="lbl">--space-8 · 32</span><div class="bar" style="width:32px"></div></div>
  <div class="item"><span class="lbl">--space-12 · 48</span><div class="bar" style="width:48px"></div></div>
  <div class="item"><span class="lbl">--space-16 · 64</span><div class="bar" style="width:64px"></div></div>
</body></html>
