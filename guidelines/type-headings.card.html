<!-- @dsCard group="Type" viewport="700x240" name="Headings — Montserrat" subtitle="Display & headings, tight tracking" -->
<!DOCTYPE html><html lang="pl"><head><meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin:0; padding:22px; background:var(--surface-card); font-family:var(--font-body); }
  .item { display:flex; align-items:baseline; gap:16px; padding:7px 0; border-bottom:1px solid var(--border-subtle); }
  .item:last-child { border-bottom:none; }
  .h { font-family:var(--font-head); color:var(--text-strong); line-height:var(--lh-tight); letter-spacing:var(--ls-tight); }
  .tag { font-size:11px; color:var(--text-muted); width:120px; flex:none; font-weight:600; }
</style></head><body>
  <div class="item"><span class="tag">Display · 56 · 800</span><span class="h" style="font-size:44px;font-weight:800">Poczuj się bezpiecznie</span></div>
  <div class="item"><span class="tag">H1 · 40 · 700</span><span class="h" style="font-size:34px;font-weight:700">Asystent Bezpieczeństwa 24/7</span></div>
  <div class="item"><span class="tag">H2 · 32 · 700</span><span class="h" style="font-size:28px;font-weight:700">Monitorowanie trasy</span></div>
  <div class="item"><span class="tag">H3 · 24 · 600</span><span class="h" style="font-size:24px;font-weight:600">Wezwanie pomocy</span></div>
  <div class="item"><span class="tag">H4 · 20 · 600</span><span class="h" style="font-size:20px;font-weight:600">Wybierz środek transportu</span></div>
</body></html>
